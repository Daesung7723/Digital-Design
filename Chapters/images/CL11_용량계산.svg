<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">ROM 용량 계산 — 워드와 주소</title>
  <desc id="figure-description">주소 3비트가 3-to-8 디코더를 거쳐 8개 워드 가운데 주소 101(5번)의 워드를 선택하고, 그 워드의 4비트 1011이 출력된다. 워드 수 2의 3제곱 = 8, 워드 폭 4비트, 용량 32비트.</desc>
