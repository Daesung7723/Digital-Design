<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
<!-- R1 / R2 -->
<rect x="40" y="20" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#006199" stroke-width="2"/>
<text x="120" y="42" font-size="17" font-weight="bold" text-anchor="middle" fill="#006199">R1</text>
<text x="120" y="59" font-size="11.5" text-anchor="middle" fill="#485A64">4비트 레지스터</text>
<rect x="570" y="20" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#006199" stroke-width="2"/>
<text x="650" y="42" font-size="17" font-weight="bold" text-anchor="middle" fill="#006199">R2</text>
<text x="650" y="59" font-size="11.5" text-anchor="middle" fill="#485A64">4비트 레지스터</text>
<!-- A bus (R1) -->
<path d="M120,66 V100 H590" fill="none" stroke="#006199" stroke-width="2.2"/>
<text x="127" y="88" font-size="12" fill="#485A64">A3~A0</text>
<!-- B bus (R2) -->
<path d="M650,66 V128 H180" fill="none" stroke="#2EA7E0" stroke-width="2.2"/>
<text x="643" y="88" font-size="12" text-anchor="end" fill="#485A64">B3~B0</text>
<!-- A taps -->
<path d="M140,100 V165 M290,100 V165 M440,100 V165 M590,100 V165" fill="none" stroke="#006199" stroke-width="2"/>
<circle cx="140" cy="100" r="3.6" fill="#006199"/><circle cx="290" cy="100" r="3.6" fill="#006199"/><circle cx="440" cy="100" r="3.6" fill="#006199"/>
<!-- B taps -->
<path d="M180,128 V165 M330,128 V165 M480,128 V165 M630,128 V165" fill="none" stroke="#2EA7E0" stroke-width="2"/>
<circle cx="330" cy="128" r="3.6" fill="#2EA7E0"/><circle cx="480" cy="128" r="3.6" fill="#2EA7E0"/><circle cx="630" cy="128" r="3.6" fill="#2EA7E0"/>
<!-- adder outline -->
<rect x="92" y="150" width="584" height="102" rx="8" fill="none" stroke="#7A8BA6" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="235" y="247" font-size="12" text-anchor="middle" fill="#485A64">4비트 가산기(4장)</text>
<!-- FA blocks -->
<g font-size="11.5" fill="#485A64">
<rect x="112" y="165" width="96" height="60" rx="5" fill="#EAF6FD" stroke="#006199" stroke-width="2"/>
<text x="140" y="180" text-anchor="middle">A3</text><text x="180" y="180" text-anchor="middle">B3</text>
<rect x="262" y="165" width="96" height="60" rx="5" fill="#EAF6FD" stroke="#006199" stroke-width="2"/>
<text x="290" y="180" text-anchor="middle">A2</text><text x="330" y="180" text-anchor="middle">B2</text>
<rect x="412" y="165" width="96" height="60" rx="5" fill="#EAF6FD" stroke="#006199" stroke-width="2"/>
<text x="440" y="180" text-anchor="middle">A1</text><text x="480" y="180" text-anchor="middle">B1</text>
<rect x="562" y="165" width="96" height="60" rx="5" fill="#EAF6FD" stroke="#006199" stroke-width="2"/>
<text x="590" y="180" text-anchor="middle">A0</text><text x="630" y="180" text-anchor="middle">B0</text>
</g>
<g font-size="16" font-weight="bold" fill="#006199" text-anchor="middle">
<text x="160" y="208">FA</text><text x="310" y="208">FA</text><text x="460" y="208">FA</text><text x="610" y="208">FA</text>
</g>
<!-- carry chain -->
<g stroke="#485A64" stroke-width="1.8" fill="none">
<path d="M700,197 H664"/><path d="M562,197 H514"/>
<path d="M412,197 H364"/><path d="M262,197 H214"/><path d="M112,197 H72"/>
</g>
<g fill="#485A64">
<polygon points="658,197 666,192 666,202"/>
<polygon points="508,197 516,192 516,202"/>
<polygon points="358,197 366,192 366,202"/>
<polygon points="208,197 216,192 216,202"/>
<polygon points="66,197 74,192 74,202"/>
</g>
<g font-size="12" fill="#485A64" text-anchor="middle">
<text x="537" y="190">C1</text><text x="387" y="190">C2</text><text x="237" y="190">C3</text>
</g>
<text x="64" y="201" font-size="12" text-anchor="end" fill="#485A64">C4</text>
<text x="704" y="201" font-size="12" fill="#485A64">C0 = 0</text>
<!-- sum lines -->
<path d="M160,225 V300 M310,225 V300 M460,225 V300 M610,225 V300" fill="none" stroke="#006199" stroke-width="2"/>
<g font-size="12" fill="#485A64">
<text x="166" y="276">S3</text><text x="316" y="276">S2</text><text x="466" y="276">S1</text><text x="616" y="276">S0</text>
</g>
<!-- R3 -->
<rect x="110" y="300" width="550" height="50" rx="6" fill="#FFFFFF" stroke="#006199" stroke-width="2"/>
<text x="385" y="322" font-size="17" font-weight="bold" text-anchor="middle" fill="#006199">R3</text>
<text x="385" y="341" font-size="11.5" text-anchor="middle" fill="#485A64">병렬 로드 레지스터(9장) — 입력 I = S3~S0</text>
<text x="652" y="330" font-size="12.5" font-weight="bold" text-anchor="end" fill="#0086CD">Load</text>
<polygon points="530,350 540,339 550,350" fill="none" stroke="#006199" stroke-width="1.6"/>
<!-- P -->
<path d="M738,325 H670" fill="none" stroke="#0086CD" stroke-width="3"/>
<polygon points="660,325 671,318 671,332" fill="#0086CD"/>
<text x="742" y="318" font-size="16" font-weight="bold" text-anchor="end" fill="#0086CD">P</text>
<!-- CLK -->
<path d="M540,350 V384" fill="none" stroke="#485A64" stroke-width="2" stroke-dasharray="5,3"/>
<text x="540" y="402" font-size="13" text-anchor="middle" fill="#485A64">CLK</text>
<text x="40" y="402" font-size="12" fill="#485A64">R1, R2의 클럭 입력도 같은 CLK에 연결(그림에서 생략)</text>
<text x="730" y="402" font-size="12" text-anchor="end" fill="#485A64">● = 연결 지점</text>
</svg>
